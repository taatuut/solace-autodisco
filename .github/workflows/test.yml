name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python3 -m pip install -r requirements-dev.txt

      - name: Compile check
        run: python3 -m py_compile run_pipeline.py src/semp_extractor.py src/taxonomy_mapper.py src/report_generator.py

      - name: Run tests
        run: pytest -v
